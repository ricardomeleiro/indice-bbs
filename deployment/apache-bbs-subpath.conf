# Bloco a ser adicionado dentro do <VirtualHost *:443> de
#   /etc/apache2/sites-available/hub.c-innovation.com.br.conf
# ANTES da linha `ProxyPass  /  http://localhost:18000/`.
#
# Modelo: subpath do Hub → app BBS em https://hub.c-innovation.com.br/bbs/
# Proteção: forward-auth via Authentik embedded outpost (same-domain SSO).
#
# Módulos necessários (uma vez só na EC2):
#   sudo a2enmod ssl proxy proxy_http proxy_wstunnel headers rewrite auth_openidc
#   ou (se optar pela abordagem mod_auth_openidc — recomendada pela Authentik para Apache)
#
# ATENÇÃO: pré-requisito é ter no Authentik:
#   1) Application "Índice BBS" (slug: indice-bbs)
#   2) Proxy Provider modo "Forward auth (single application)"
#      External host: https://hub.c-innovation.com.br/bbs
#   3) Provider vinculado ao Embedded Outpost
#   4) (Opcional) Grupos: bbs-admin, bbs-editor — o resto autenticado vira viewer
#
# ------------------------------------------------------------------
# Bloco a incluir DENTRO do <VirtualHost *:443> do hub, antes de `ProxyPass /`:

<Location "/bbs">
    # 1) Pergunta ao outpost se o usuário está autenticado
    AuthType openid-connect
    # Estas duas linhas presumem mod_auth_openidc; se preferir o modelo
    # nativo do outpost (auth_request), veja a alternativa abaixo.
    Require valid-user

    # 2) Repassa para o container da app BBS (loopback:18010)
    ProxyPass        http://127.0.0.1:18010/
    ProxyPassReverse http://127.0.0.1:18010/

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Prefix "/bbs"

    # 3) Encaminha os headers da Authentik (o outpost os injeta)
    # X-Authentik-Username, X-Authentik-Email, X-Authentik-Name, X-Authentik-Groups
</Location>

# ------------------------------------------------------------------
# ALTERNATIVA "forward-auth" pura (sem mod_auth_openidc) — use ESTA se
# você seguir a receita da Fase 3b do Hub (mesma que Kuma):
#
# Adicione fora do <Location /bbs> (mas dentro do vhost) — endpoint do outpost:
#
# <Location "/outpost.goauthentik.io">
#     ProxyPass        http://127.0.0.1:18000/outpost.goauthentik.io
#     ProxyPassReverse http://127.0.0.1:18000/outpost.goauthentik.io
#     ProxyPreserveHost On
# </Location>
#
# Dentro do <Location /bbs>, troque o bloco AuthType/Require por:
#     # Envia cada requisição para o outpost antes de servir
#     AuthType     "authentik"
#     AuthName     "authentik"
#     Require      valid-user
#     AuthzSendForbiddenOnFailure On
#     ErrorDocument 401 "/outpost.goauthentik.io/start?rd=%{REQUEST_URI}"
#
# Referência: docs Authentik → "Apache HTTP Server as reverse proxy"
