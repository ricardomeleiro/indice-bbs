# Bloco a ser adicionado dentro do <VirtualHost *:443> de
#   /etc/apache2/sites-available/hub.c-innovation.com.br.conf
#
# Modelo: subpath → app BBS em https://hub.c-innovation.com.br/bbs/
#
# Módulos necessários (uma vez só na EC2):
#   sudo a2enmod ssl proxy proxy_http proxy_wstunnel headers rewrite
#
# ------------------------------------------------------------------
# Bloco a incluir DENTRO do <VirtualHost *:443>:

# Força barra final: /bbs -> /bbs/ (evita quebra de links relativos)
RewriteRule ^/bbs$ /bbs/ [R=301,L]

<Location "/bbs/">
    # Repassa para o container da app BBS (loopback:18010)
    ProxyPass        "http://127.0.0.1:18010/"
    ProxyPassReverse "http://127.0.0.1:18010/"

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto  "https"
    RequestHeader set X-Forwarded-Prefix "/bbs"
</Location>
