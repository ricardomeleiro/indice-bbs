{% extends "base.html" %}
{% block title %}Admin: Embarcações – Índice BBS{% endblock %}
{% block content %}

<h4 class="mb-3">Embarcações</h4>

<div class="card">
  <div class="table-responsive">
    <table class="table table-vessel mb-0">
      <thead class="table-light">
        <tr><th>Nome</th><th>Contratante</th><th class="text-center">Ativa</th><th></th></tr>
      </thead>
      <tbody>
      {% for v in vessels %}
      <tr>
        <form method="post" action="{{ request.url_for('admin_vessels_update', vessel_id=v.id) }}">
          <td><input class="form-control form-control-sm" name="name" value="{{ v.name }}" required></td>
          <td><input class="form-control form-control-sm" name="contractor" value="{{ v.contractor }}" required></td>
          <td class="text-center">
            <input type="checkbox" class="form-check-input" name="is_active" value="1"
                   {% if v.is_active %}checked{% endif %}>
          </td>
          <td class="text-end">
            <button class="btn btn-sm btn-primary"><i class="bi bi-save"></i></button>
          </td>
        </form>
      </tr>
      {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
